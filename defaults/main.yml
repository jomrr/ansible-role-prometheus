---
# role: prometheus
# file: defaults/main.yml

# Installation source for the Prometheus server.
# Choices: binary, package
prometheus_install: package

# Fixed upstream release used only for binary installations.
prometheus_version: 3.13.5

# HTTP endpoint for the Prometheus query API, metrics and web interface.
prometheus_listen_address: '127.0.0.1:9090'

# Complete native Prometheus configuration.
prometheus_config:
  global:
    scrape_interval: 15s
  scrape_configs:
    - job_name: prometheus
      static_configs:
        - targets: ['127.0.0.1:9090']
