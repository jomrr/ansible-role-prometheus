---
# role: prometheus
# file: defaults/main.yml

# Installation source for the Prometheus server.
# Choices: binary, package
prometheus_install: package

# Upstream release used for binary installations.
# Choices: stable, latest, lts, or a fixed major.minor.patch version
prometheus_version: stable

# HTTP endpoint for the Prometheus query API, metrics and web interface.
prometheus_listen_address: '127.0.0.1:9090'

# Maximum age of local TSDB samples, such as 30d.
prometheus_retention_time: ''

# Maximum size of local TSDB blocks, such as 50GB.
prometheus_retention_size: ''

# Native web configuration for TLS and basic authentication.
prometheus_web_config: {}

# Complete native Prometheus configuration.
prometheus_config:
  global:
    scrape_interval: 15s
  scrape_configs:
    - job_name: prometheus
      static_configs:
        - targets: ['127.0.0.1:9090']
