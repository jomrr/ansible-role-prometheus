---
# role: prometheus
# file: molecule/resources/playbooks/side_effect.yml

- name: PROMETHEUS | Exercise the secured package listener and size-only retention
  ansible.builtin.import_playbook: verify_web.yml

- name: PROMETHEUS | Switch the running package service to an upstream binary
  hosts: all
  gather_facts: true
  tasks:
    - name: PROMETHEUS | Install the pinned binary and replace the scrape configuration
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        prometheus_install: binary
        prometheus_version: '3.13.5'
        prometheus_retention_time: 31d
        prometheus_config:
          scrape_configs:
            - job_name: reconfigured
              scrape_interval: 2s
              static_configs:
                - targets: ['127.0.0.1:9090']

- name: PROMETHEUS | Verify the replacement job collects samples
  ansible.builtin.import_playbook: verify.yml
  vars:
    __prometheus_expected_job: reconfigured
    __prometheus_expected_version: '3.13.5'
    __prometheus_expected_retention: 31d
    __prometheus_expected_units: [/etc/systemd/system/prometheus.service]

- name: PROMETHEUS | Exercise upstream release channels
  hosts: all
  gather_facts: true
  tasks:
    - name: PROMETHEUS | Read the published releases for comparison with the running server
      ansible.builtin.uri:
        url: https://prometheus.io/download.json
      register: __prometheus_published

    - name: PROMETHEUS | Verify the default binary installation follows stable
      ansible.builtin.include_tasks: ../tasks/verify_channel.yml
      vars:
        __prometheus_test_channel: stable

    - name: PROMETHEUS | Apply and verify the other release channels
      ansible.builtin.include_tasks: ../tasks/verify_channel.yml
      vars:
        prometheus_version: "{{ __prometheus_test_channel }}"
      loop: [latest, lts]
      loop_control:
        loop_var: __prometheus_test_channel

    - name: PROMETHEUS | Record the running LTS service invocation
      ansible.builtin.systemd_service:
        name: prometheus.service
        state: started
      check_mode: true
      register: __prometheus_lts_invocation

    - name: PROMETHEUS | Reapply the LTS channel
      ansible.builtin.include_tasks: ../tasks/verify_channel.yml
      vars:
        __prometheus_test_channel: lts
        prometheus_version: "{{ __prometheus_test_channel }}"

    - name: PROMETHEUS | Verify the same LTS release keeps the running process
      ansible.builtin.systemd_service:
        name: prometheus.service
        state: started
      check_mode: true
      register: __prometheus_reapplied
      failed_when: __prometheus_reapplied.status.InvocationID != __prometheus_lts_invocation.status.InvocationID

- name: PROMETHEUS | Switch the running binary back to the distribution package
  hosts: all
  gather_facts: true
  tasks:
    - name: PROMETHEUS | Restore the package service and default scrape job
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        prometheus_install: package
        prometheus_version: ignored-by-package

- name: PROMETHEUS | Verify the restored package service
  ansible.builtin.import_playbook: verify.yml

- name: PROMETHEUS | Verify samples survive a change of installation mode
  hosts: all
  gather_facts: false
  tasks:
    - name: PROMETHEUS | Query historical samples from the binary service
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/query
        method: POST
        body_format: form-urlencoded
        body:
          query: 'max_over_time(up{job="reconfigured"}[1h]) == 1'
      register: __prometheus_history
      failed_when: __prometheus_history.status != 200 or __prometheus_history.json.data.result | length != 1
