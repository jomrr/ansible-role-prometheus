---
# role: prometheus
# file: molecule/resources/playbooks/verify_web.yml

- name: PROMETHEUS | Verify TLS, basic auth and size-only retention on the packaged service
  hosts: all
  gather_facts: true
  tasks:
    - name: PROMETHEUS | Install OpenSSL for the temporary test certificate
      become: true
      become_user: root
      ansible.builtin.package:
        name: openssl
        state: present

    - name: PROMETHEUS | Create a certificate for the loopback listener
      become: true
      become_user: root
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost
          -addext subjectAltName=IP:127.0.0.1 -keyout /etc/prometheus/test.key -out /etc/prometheus/test.crt
        creates: /etc/prometheus/test.crt

    - name: PROMETHEUS | Allow the service group to read the test key
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/prometheus/test.key
        owner: root
        group: prometheus
        mode: '0640'

    - name: PROMETHEUS | Enable TLS, authentication and a size limit
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        prometheus_retention_size: 1GB
        prometheus_web_config:
          tls_server_config:
            cert_file: /etc/prometheus/test.crt
            key_file: /etc/prometheus/test.key
          basic_auth_users:
            monitor: '$2b$05$6PhAVRmVAJvUjg7acGT.bu9e5vPVbEQTeju/F1m2xCWPg4RrLjh2m'

    - name: PROMETHEUS | Require authentication on the trusted HTTPS listener
      ansible.builtin.uri:
        url: https://127.0.0.1:9090/api/v1/status/runtimeinfo
        ca_path: /etc/prometheus/test.crt
        status_code: 401
      register: __prometheus_unauthenticated
      until: __prometheus_unauthenticated.status == 401
      retries: 20
      delay: 1

    - name: PROMETHEUS | Verify authenticated access and retention without an age limit
      ansible.builtin.uri:
        url: https://127.0.0.1:9090/api/v1/status/runtimeinfo
        ca_path: /etc/prometheus/test.crt
        url_username: monitor
        url_password: fixture-web-auth-92e7
        force_basic_auth: true
      register: __prometheus_runtime
      failed_when: __prometheus_runtime.json.data.storageRetention not in ['1GiB', '1GB']
