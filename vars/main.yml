---
# role: prometheus
# file: vars/main.yml

__prometheus_config_file: /etc/prometheus/prometheus.yml
__prometheus_architectures:
  x86_64: amd64
  aarch64: arm64
__prometheus_release: "prometheus-{{ prometheus_version }}.linux-{{ __prometheus_architectures[ansible_facts.architecture] }}"
__prometheus_download_url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}"
__prometheus_libexec_dir: /usr/local/libexec/prometheus
__prometheus_programs: [promtool, prometheus]
__prometheus_promtool: "{{ '/usr/bin/promtool' if prometheus_install == 'package' else __prometheus_libexec_dir ~ '/promtool-' ~ prometheus_version }}"
__prometheus_data_dir: "{{ '/var/lib/prometheus' if __prometheus_legacy_wal.stat.exists else __prometheus_package_data_dir }}"
