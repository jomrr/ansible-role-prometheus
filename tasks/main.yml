---
# role: prometheus
# file: tasks/main.yml

- name: PROMETHEUS | Validate installation settings
  ansible.builtin.import_tasks: assert.yml

- name: PROMETHEUS | Install the release archive prerequisites
  become: true
  become_user: root
  ansible.builtin.package:
    name: [ca-certificates, gzip, tar]
    state: present

- name: PROMETHEUS | Create the service group
  become: true
  become_user: root
  ansible.builtin.group:
    name: prometheus
    system: true

- name: PROMETHEUS | Create the service account
  become: true
  become_user: root
  ansible.builtin.user:
    name: prometheus
    group: prometheus
    home: /var/lib/prometheus
    create_home: false
    shell: /bin/false
    system: true

- name: PROMETHEUS | Create the release directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /usr/local/libexec/prometheus
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: PROMETHEUS | Download and verify the release archive
  become: true
  become_user: root
  ansible.builtin.get_url:
    url: "{{ __prometheus_download_url }}/{{ __prometheus_release }}.tar.gz"
    checksum: "sha256:{{ __prometheus_download_url }}/sha256sums.txt"
    dest: "/var/cache/{{ __prometheus_release }}.tar.gz"
    owner: root
    group: root
    mode: '0644'

- name: PROMETHEUS | Install the server and matching validator
  become: true
  become_user: root
  ansible.builtin.unarchive:
    src: "/var/cache/{{ __prometheus_release }}.tar.gz"
    remote_src: true
    dest: /usr/local/libexec/prometheus
    include:
      - "{{ __prometheus_release }}/prometheus"
      - "{{ __prometheus_release }}/promtool"
    owner: root
    group: root
    mode: '0755'
  notify: PROMETHEUS | Restart Prometheus

- name: PROMETHEUS | Create the configuration directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    owner: root
    group: prometheus
    mode: '0750'

- name: PROMETHEUS | Validate and install the scrape configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: prometheus
    mode: '0640'
    validate: "{{ __prometheus_bin_dir }}/promtool check config %s"
    backup: true
  diff: false
  no_log: true
  notify: PROMETHEUS | Restart Prometheus

- name: PROMETHEUS | Install the systemd unit
  become: true
  become_user: root
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: '0644'
  register: __prometheus_unit
  notify: PROMETHEUS | Restart Prometheus

- name: PROMETHEUS | Apply service changes
  ansible.builtin.meta: flush_handlers

- name: PROMETHEUS | Enable and start the server
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: prometheus.service
    enabled: true
    state: started
