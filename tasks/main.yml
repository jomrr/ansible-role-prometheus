---
# role: prometheus
# file: tasks/main.yml

- name: PROMETHEUS | Validate installation settings
  ansible.builtin.import_tasks: assert.yml

- name: PROMETHEUS | Load the distribution package name and paths
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', __prometheus_platform_files) }}"
  vars:
    __prometheus_platform_files:
      files:
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: PROMETHEUS | Locate the database from earlier binary installations
  become: true
  become_user: root
  ansible.builtin.stat:
    path: /var/lib/prometheus/wal
  register: __prometheus_legacy_wal

- name: PROMETHEUS | Install the selected server
  ansible.builtin.include_tasks: "install-{{ prometheus_install }}.yml"

- name: PROMETHEUS | Set permissions on the active database directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __prometheus_data_dir }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0750'

- name: PROMETHEUS | Validate and install the scrape configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ __prometheus_config_file }}"
    owner: root
    group: prometheus
    mode: '0640'
    validate: "{{ __prometheus_promtool }} check config %s"
    backup: true
  diff: false
  no_log: true
  notify: PROMETHEUS | Restart Prometheus

- name: PROMETHEUS | Validate and install the web configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: web-config.yml.j2
    dest: "{{ __prometheus_web_config_file }}"
    owner: root
    group: prometheus
    mode: '0640'
    validate: "{{ __prometheus_promtool }} check web-config %s"
  diff: false
  no_log: true
  when: prometheus_web_config | length > 0
  notify: PROMETHEUS | Restart Prometheus

- name: PROMETHEUS | Set the server arguments in the distribution environment file
  become: true
  become_user: root
  ansible.builtin.lineinfile:
    path: "{{ __prometheus_env_file }}"
    regexp: '^ARGS='
    line: >-
      ARGS="--config.file={{ __prometheus_config_file }}
      --storage.tsdb.path={{ __prometheus_data_dir }} --web.listen-address={{ prometheus_listen_address }}
      {%- if prometheus_retention_time not in [none, ''] %} --storage.tsdb.retention.time={{ prometheus_retention_time }}{% endif %}
      {%- if prometheus_retention_size not in [none, ''] %} --storage.tsdb.retention.size={{ prometheus_retention_size }}{% endif %}
      {%- if prometheus_web_config %} --web.config.file={{ __prometheus_web_config_file }}{% endif %}"
    create: true
    owner: root
    group: root
    mode: '0600'
  diff: false
  notify: PROMETHEUS | Restart Prometheus

- name: PROMETHEUS | Activate the selected installation
  ansible.builtin.include_tasks: "{{ prometheus_install }}-unit.yml"

- name: PROMETHEUS | Create the systemd drop-in directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: PROMETHEUS | Install the systemd sandbox
  become: true
  become_user: root
  ansible.builtin.template:
    src: sandbox.conf.j2
    dest: /etc/systemd/system/prometheus.service.d/10-ansible.conf
    owner: root
    group: root
    mode: '0644'
  notify: PROMETHEUS | Restart Prometheus

- name: PROMETHEUS | Apply service changes
  ansible.builtin.meta: flush_handlers

- name: PROMETHEUS | Enable and start the server
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: prometheus.service
    enabled: true
    state: started

- name: PROMETHEUS | Remove the unused role-managed web configuration
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __prometheus_web_config_file }}"
    state: absent
  when: prometheus_web_config | length == 0
