---
# role: prometheus
# file: tasks/install-package.yml

- name: PROMETHEUS | Enable the EPEL package repository on AlmaLinux
  become: true
  become_user: root
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts.distribution == 'AlmaLinux'

- name: PROMETHEUS | Install the distribution server package
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __prometheus_package }}"
    state: present
  module_defaults:
    ansible.builtin.apt:
      install_recommends: false
      policy_rc_d: 101
  notify: PROMETHEUS | Restart Prometheus
