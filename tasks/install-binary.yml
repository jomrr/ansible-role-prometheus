---
# role: prometheus
# file: tasks/install-binary.yml

- name: PROMETHEUS | Install the release archive prerequisites
  become: true
  become_user: root
  ansible.builtin.package:
    name: [ca-certificates, gzip, tar]
    state: present

- name: PROMETHEUS | Resolve the selected release channel
  when: not __prometheus_is_pinned
  block:
    - name: PROMETHEUS | Read the upstream download catalog
      ansible.builtin.uri:
        url: https://prometheus.io/download.json
      register: __prometheus_catalog
      check_mode: false

    - name: PROMETHEUS | Require a matching release before installing
      ansible.builtin.assert:
        that: __prometheus_channel_versions | length > 0
        fail_msg: "The Prometheus download catalog contains no release for channel '{{ prometheus_version }}'."
        quiet: true

- name: PROMETHEUS | Create the service group
  become: true
  become_user: root
  ansible.builtin.group:
    name: prometheus
    system: true

- name: PROMETHEUS | Create the service account
  become: true
  become_user: root
  ansible.builtin.user:
    name: prometheus
    group: prometheus
    home: "{{ __prometheus_user_home }}"
    create_home: false
    shell: "{{ __prometheus_user_shell }}"
    system: true

- name: PROMETHEUS | Create the release directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __prometheus_libexec_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  register: __prometheus_release_dir

- name: PROMETHEUS | Download and verify the release archive
  become: true
  become_user: root
  ansible.builtin.get_url:
    url: "{{ __prometheus_download_url }}/{{ __prometheus_release }}.tar.gz"
    checksum: "sha256:{{ __prometheus_download_url }}/sha256sums.txt"
    dest: "/var/cache/{{ __prometheus_release }}.tar.gz"
    owner: root
    group: root
    mode: '0644'
  register: __prometheus_archive

- name: PROMETHEUS | Install the server and matching validator
  become: true
  become_user: root
  ansible.builtin.unarchive:
    src: "/var/cache/{{ __prometheus_release }}.tar.gz"
    remote_src: true
    dest: "{{ __prometheus_libexec_dir }}"
    include:
      - "{{ __prometheus_release }}/prometheus"
      - "{{ __prometheus_release }}/promtool"
    extra_opts:
      - '--transform=s|^.*/||'
      - '--transform=s|$|-{{ __prometheus_version }}|'
    owner: root
    group: root
    mode: '0755'
  # A dry run may only have predicted the directory or archive.
  when: __prometheus_release_dir.state is defined and __prometheus_archive.state is defined
  register: __prometheus_extract
  notify: "{{ __prometheus_install_notify }}"

- name: PROMETHEUS | Link the local commands to the selected release
  become: true
  become_user: root
  ansible.builtin.file:
    src: "{{ __prometheus_libexec_dir }}/{{ __prometheus_program }}-{{ __prometheus_version }}"
    dest: "/usr/local/bin/{{ __prometheus_program }}"
    state: link
    follow: false
    force: "{{ __prometheus_extract is skipped }}"
  loop: "{{ __prometheus_programs }}"
  loop_control:
    loop_var: __prometheus_program
    label: "{{ __prometheus_program }}"
  notify: "{{ __prometheus_install_notify }}"
