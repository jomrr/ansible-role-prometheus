---
# role: prometheus
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Install and configure a standalone Prometheus server.
    options:
      prometheus_install:
        type: str
        choices:
          - binary
          - package
        default: package
        description: Install the distribution package or an upstream binary release.
      prometheus_version:
        type: str
        choices:
          - stable
          - latest
          - lts
          - '{{ prometheus_version if prometheus_install == ''package'' or __prometheus_is_pinned
            else omit }}'
        default: stable
        description: Binary release to install. Use a major.minor.patch version or follow
          the stable, latest or lts field in the Prometheus download catalog.
      prometheus_listen_address:
        type: str
        default: 127.0.0.1:9090
        description: HTTP listen endpoint in host:port or [IPv6]:port form.
      prometheus_retention_time:
        type: str
        default: ''
        description: Maximum sample age, for example 30d or 1w12h. An empty string omits
          the time flag.
      prometheus_retention_size:
        type: str
        default: ''
        description: Maximum local block size, for example 50GB. An empty string omits the
          size flag. A positive size alone disables time-based retention.
      prometheus_web_config:
        type: dict
        default: {}
        description: Native Prometheus web configuration, including tls_server_config and
          basic_auth_users. An empty mapping disables the web config file.
      prometheus_config:
        type: dict
        default:
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets:
                    - 127.0.0.1:9090
        description: Complete native Prometheus configuration, including scrape jobs and
          optional alerting or remote storage settings.
